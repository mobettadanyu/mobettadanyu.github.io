<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Walk the Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script>
    // Keeps the player standing on top of whatever surface is below them
    AFRAME.registerComponent('ground-snap', {
      schema: {
        target:  { type: 'selector' },
        camera:  { type: 'selector' },
        maxStep: { default: 0.8 }   // how high a step/ledge you can walk up (meters)
      },
      init() {
        this.ray = new THREE.Raycaster();
        this.down = new THREE.Vector3(0, -1, 0);
        this.origin = new THREE.Vector3();
        this.meshes = [];
        this.v = new THREE.Vector3();
        this.data.target.addEventListener('model-loaded', () => {
          this.meshes = [];
          this.data.target.object3D.traverse(o => { if (o.isMesh) this.meshes.push(o); });
          this.data.target.object3D.updateMatrixWorld(true);
          // initial spawn: drop from high above onto the map
          const p = this.el.object3D.position;
          this.data.camera.object3D.getWorldPosition(this.v);
          const hit = this.cast(this.v.x, 1000, this.v.z);
          if (hit) p.y = hit.point.y;
          document.getElementById('hint').textContent =
            'Click to look around • WASD to walk • Shift to run';
        });
      },
      cast(x, y, z) {
        this.origin.set(x, y, z);
        this.ray.set(this.origin, this.down);
        const hits = this.ray.intersectObjects(this.meshes, false);
        return hits.length ? hits[0] : null;
      },
      tick() {
        if (!this.meshes.length) return;
        const p = this.el.object3D.position;
        this.data.camera.object3D.getWorldPosition(this.v);
        const hit = this.cast(this.v.x, p.y + this.data.maxStep, this.v.z);
        if (hit) p.y += (hit.point.y - p.y) * 0.5; // smooth
      }
    });

    // Shift to run
    AFRAME.registerComponent('run-on-shift', {
      init() {
        const wasd = () => this.el.components['wasd-controls'];
        window.addEventListener('keydown', e => { if (e.key === 'Shift') wasd().data.acceleration = 160; });
        window.addEventListener('keyup',   e => { if (e.key === 'Shift') wasd().data.acceleration = 52; });
      }
    });
  </script>
  <style>
    #ui { position: fixed; top: 10px; left: 10px; z-index: 10; font: 14px sans-serif;
          color: #fff; background: rgba(0,0,0,.5); padding: 8px 12px; border-radius: 8px; }
    #ui label { cursor: pointer; text-decoration: underline; }
    #ui input { display: none; }
  </style>
</head>
<body>
  <div id="ui">
    <div id="hint">Loading map.glb…</div>
    <label>Load a different .glb<input type="file" id="file" accept=".glb,.gltf"></label>
  </div>

  <a-scene renderer="colorManagement: true" background="color: #87ceeb">
    <a-entity light="type: ambient; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; intensity: 0.9" position="-1 3 2"></a-entity>

    <!-- Your map. Put map.glb next to this file. Adjust scale if it's too big/small. -->
    <a-entity id="map" gltf-model="url(map.glb)" scale="1 1 1"></a-entity>

    <!-- Player: move this rig around, camera sits at eye height inside -->
    <a-entity id="rig" position="0 0 0"
              ground-snap="target: #map; camera: #cam; maxStep: 0.8">
      <!-- wasd-controls lives on the camera so W moves where you're looking.
           Eye height 1.28 = 20% smaller than 1.6 -->
      <a-entity id="cam" camera look-controls wasd-controls="acceleration: 52"
                run-on-shift position="0 1.28 0"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    // Fallback: pick the .glb from your computer (works even when opened as a local file)
    document.getElementById('file').addEventListener('change', e => {
      const f = e.target.files[0];
      if (!f) return;
      document.getElementById('hint').textContent = 'Loading ' + f.name + '…';
      document.getElementById('map').setAttribute('gltf-model', URL.createObjectURL(f));
    });
  </script>
</body>
</html>
